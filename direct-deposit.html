<title>Set up direct deposit</title>
<style>
  :root {
    --red: #D22730;
    --black: #2D2A26;
    --grey: #636466;
    --lgrey: #C7C8CA;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Verdana, Geneva, sans-serif;
    background: #fff;
    margin: 0;
    color: var(--black);
  }
  .page { max-width: 100%; }

  .topnav { background: #fff; height: 64px; padding: 0 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(45,42,38,.08); }
  .topnav img { height: 28px; width: auto; display: block; }

  /* ---- hero: same treatment as every other page (photo + overlay), responsive min-height ---- */
  .hero { position: relative; min-height: clamp(220px, 28.6vw, 330px); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 65%; display: block; }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 100%);
  }
  .hero-inner { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; width: 100%; padding: 142px 40px 44px; }
  .hero-inner h1 { color: #fff; font-size: 32px; line-height: 1.15; margin: 0 0 10px; font-weight: 700; max-width: 620px; }
  .hero-inner p { color: rgba(255,255,255,.92); font-size: 14.5px; margin: 0; max-width: 52ch; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---- form section: white card holding the embedded Jotform, aligned to the 1120px container ---- */
  .content-section { padding: 40px 0 60px; }
  .content-wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
  .form-card {
    background: #fff;
    border: 1px solid var(--lgrey);
    border-radius: var(--radius);
    overflow: hidden;
    padding: 4px;
  }
  .form-card iframe { width: 100%; display: block; border: none; }
  .form-placeholder {
    padding: 60px 30px;
    text-align: center;
    color: var(--grey);
    font-size: 13.5px;
    border: 2px dashed var(--lgrey);
    border-radius: var(--radius);
    background: #FAFAF9;
  }
  .form-placeholder strong { display: block; color: var(--black); font-size: 15px; margin-bottom: 6px; }

  .foot { background: var(--black); padding: 28px 40px; }
  .foot-inner { }
  .foot-content { display: flex; flex-direction: column; gap: 8px; }
  .foot-content p { margin: 0; font-size: 13px; color: #cfcdca; line-height: 1.5; }
  .foot-name b { color: #fff; font-weight: 700; }
  .foot-barred { display: flex; gap: 16px; }
  .foot-bar { width: 2px; background: var(--red); border-radius: 1px; flex-shrink: 0; align-self: stretch; }
  .foot-lines { display: flex; flex-direction: column; gap: 2px; }
  .foot-link { color: #cfcdca; text-decoration: none; }
  .foot-link:hover { color: var(--red); font-weight: 700; }

  @media (max-width: 640px) {
    .topnav, .foot { padding-left: 24px; padding-right: 24px; }
    .content-wrap { padding-left: 24px; padding-right: 24px; }
    .hero-inner { padding-left: 24px; padding-right: 24px; }
  }
</style>
</head>
